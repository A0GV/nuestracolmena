# MyHive on the CyberSOC VM (Kali with MISP/Cortex), replacing TheHive.
# Usage: cp .env.example .env (set secrets) && docker compose up -d --build
# Cortex/MISP are reached through the VM address (192.0.2.4), registered as connectors.
name: myhive

services:
  postgres:
    image: postgres:16-alpine
    container_name: myhive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myhive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: myhive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhive -d myhive"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/cybersoc-vm/Dockerfile
      target: api
    image: myhive-api:local
    container_name: myhive-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://myhive:${POSTGRES_PASSWORD}@postgres:5432/myhive?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: ${CORS_ORIGIN:-https://192.0.2.4:9443}
      # Enlaces en notificaciones (email/webhook) y catálogo ATT&CK / subidas.
      PUBLIC_URL: ${PUBLIC_URL:-https://192.0.2.4:9443}
      MITRE_ATTACK_URL: ${MITRE_ATTACK_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # Programadores en segundo plano (false los desactiva).
      INTEGRATIONS_SCHEDULER: ${INTEGRATIONS_SCHEDULER:-true}
      SLA_SCHEDULER: ${SLA_SCHEDULER:-true}
      EMAIL_SCHEDULER: ${EMAIL_SCHEDULER:-true}
    volumes:
      - uploads:/data/uploads
    ports:
      # API for n8n/Wazuh integrations (the web on 9443 also proxies /api).
      - "${MYHIVE_API_BIND:-0.0.0.0}:4100:4100"

  web:
    build:
      context: ../..
      dockerfile: deploy/cybersoc-vm/Dockerfile
      target: web
    image: myhive-web:local
    container_name: myhive-web
    restart: unless-stopped
    depends_on:
      - api
    # HTTPS on 9443, the port TheHive used (n8n posts to https://192.0.2.4:9443/api/v1/alert).
    # Same port as soc-hive-nginx: only one of them can run (see sirp.sh).
    ports:
      - "${MYHIVE_WEB_BIND:-0.0.0.0}:${MYHIVE_WEB_PORT:-9443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # server.crt + server.key (not in git). Default: a copy of TheHive's certificate.
      - ${MYHIVE_CERTS_DIR:-./certs}:/etc/nginx/certs:ro

  # Gráficas (Grafana) leyendo la base con un rol de solo lectura; servida en /grafana/ por web.
  # Opcional: se activa con COMPOSE_PROFILES=grafana en .env (ver README, sección Grafana).
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: myhive-grafana
    restart: unless-stopped
    profiles: ["grafana"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-https://192.0.2.4:9443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nuestracolmena-resumen.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      MYHIVE_GRAFANA_DB_HOST: postgres:5432
      MYHIVE_GRAFANA_DB_NAME: myhive
      MYHIVE_GRAFANA_DB_USER: nuestracolmena_grafana
      MYHIVE_GRAFANA_DB_PASSWORD: ${MYHIVE_GRAFANA_DB_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  uploads:
  grafana-data:
