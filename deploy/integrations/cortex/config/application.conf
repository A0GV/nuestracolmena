# Cortex configuration for MyHive (generated secret/index files are gitignored)
include "/etc/cortex/secret.conf"
include "/etc/cortex/index.conf"

play.http.parser.maxMemoryBuffer=1M
play.http.parser.maxDiskBuffer=1G
play.http.session.secure = false
play.filters.csrf.cookie.secure = false
play.filters.csrf.cookie.httpOnly = false
play.http.forwarded.trustedProxies=["0.0.0.0/0", "::/0"]
cache.job = 10 minutes

auth {
  provider = [local]
  method.basic = true
  ad {}
  ldap {}
}

job {
  runner = [docker]
}

analyzer {
  urls = [
    "https://catalogs.download.strangebee.com/latest/json/analyzers.json"
    "/opt/cortexneurons/analyzers"
  ]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

responder {
  urls = [
    "https://catalogs.download.strangebee.com/latest/json/responders.json"
    "/opt/cortexneurons/responders"
  ]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}
